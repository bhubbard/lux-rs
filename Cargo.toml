[package]
name = "lux-rs"
version = "0.0.1"
edition = "2021"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
description = "Blazingly fast, lightweight media downloader and extractor written in pure safe Rust, inspired by iawia002/lux"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bhubbard/lux-rs"
homepage = "http://code.brandonhubbard.com/lux-rs/"

[[bin]]
name = "lux"
path = "src/bin/main.rs"

[lib]
name = "lux_rs"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "gzip", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
url = "2.5"
scraper = "0.20"
indicatif = { version = "0.17", features = ["tokio"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"
async-trait = "0.1"
bytes = "1.7"
md-5 = "0.10"
hex = "0.4"
quick-xml = { version = "0.36", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.12"
tokio-test = "0.4"
wiremock = "0.6"
